<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Move</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.brown.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.cburnett.css">
<style>
  :root { --bg:#16181d; --panel:#1f232b; --line:#2e333d; --fg:#e6e6e6; --dim:#9aa1ad; --ok:#4caf50; --bad:#e5534b; --acc:#d9a441; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif; }
  header { display:flex; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center; }
  header input { flex:1; min-width:220px; padding:8px; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 11px; cursor:pointer; }
  button:hover { border-color:var(--acc); } button.on { background:var(--acc); color:#111; border-color:var(--acc); }
  .msg { margin:8px 16px 0; padding:8px 12px; border:1px solid var(--bad); border-radius:6px; background:var(--panel); }
  .msg code { background:var(--bg); padding:1px 5px; border-radius:4px; } .msg a { color:var(--acc); }
  #sources { display:flex; gap:6px; flex-wrap:wrap; padding:6px 16px; color:var(--dim); font-size:12px; }
  #sources span { border:1px solid var(--line); border-radius:12px; padding:2px 8px; } #sources b { cursor:pointer; margin-left:6px; }
  main { display:grid; grid-template-columns:250px auto 1fr; gap:16px; padding:12px 16px; align-items:start; }
  /* narrow screens: board first, then the panel, then a short scrollable game list */
  @media (max-width:900px) { main { grid-template-columns:1fr; } #games { order:3; max-height:40vh; } #side { order:2; } }
  #games { max-height:80vh; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .g { display:flex; align-items:center; gap:6px; padding:7px 9px; border-bottom:1px solid var(--line); cursor:pointer; }
  .g.cur { background:var(--panel); box-shadow:inset 3px 0 var(--acc); } .g .n { flex:1; font-size:13px; }
  .g small { color:var(--dim); display:block; } .badge { background:var(--acc); color:#111; border-radius:9px; padding:0 6px; font-size:11px; font-weight:700; }
  .bell { padding:2px 6px; font-size:12px; opacity:.45; } .bell.on { opacity:1; background:transparent; color:var(--acc); }
  #board { width:min(92vw,520px); height:min(92vw,520px); }
  .clk { display:flex; justify-content:space-between; align-items:center; width:min(92vw,520px); margin:6px 0; padding:5px 10px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px; font-variant-numeric:tabular-nums; }
  .clk b { font-size:20px; } .clk.run { border-color:var(--acc); } .clk.run b { color:var(--acc); } .clk.low b { color:var(--bad); }
  #panel { display:flex; flex-direction:column; gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .dim { color:var(--dim); }
  table { border-collapse:collapse; width:100%; font-size:13px; } td,th { padding:3px 6px; border-bottom:1px solid var(--line); text-align:left; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  /* board colours come from settings: a checkerboard with a8 light */
  #board cg-board { background:repeating-conic-gradient(var(--sq-d,#b58863) 0 25%, var(--sq-l,#f0d9b5) 0 50%) 0 0 / 25% 25%; }
  #board { border-radius:4px; overflow:hidden; box-shadow:0 8px 28px rgba(0,0,0,.45); }
  /* the whole game, always on the right */
  .moves { position:relative; max-height:min(46vh,380px); overflow:auto; margin:-10px -12px 8px; border-radius:8px 8px 0 0; border-bottom:1px solid var(--line);
    display:grid; grid-template-columns:42px 1fr 1fr; font-variant-numeric:tabular-nums; }
  .moves .no { color:var(--dim); text-align:right; padding:4px 8px 4px 0; background:rgba(0,0,0,.18); }
  .mv { padding:4px 8px; cursor:pointer; border-radius:3px; line-height:1.25; }
  .mv:hover { background:rgba(255,255,255,.06); } .mv.cur { background:var(--acc); color:#111; font-weight:600; }
  .mv i { display:block; font-style:normal; font-size:11px; color:var(--dim); } .mv.cur i { color:#333; }
  .mv i.hit { color:var(--ok); } .mv.pending { color:#7fb0ff; cursor:default; font-style:italic; }
  .moves .empty { grid-column:1/-1; padding:8px 12px; color:var(--dim); }
  .nav { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; } .nav button { font-size:15px; padding:5px; }
  /* settings */
  #settings { position:absolute; right:16px; top:56px; z-index:20; width:300px; box-shadow:0 12px 32px rgba(0,0,0,.5); }
  #settings h4 { margin:10px 0 6px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; } #settings h4:first-child { margin-top:0; }
  .swatches { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .swatches button { padding:0; height:38px; border-width:2px; background:repeating-conic-gradient(var(--d) 0 25%, var(--l) 0 50%) 0 0 / 50% 50%; }
  .swatches button.sel, .sets button.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
  .sets { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .sets button { padding:3px; height:46px; display:flex; align-items:center; justify-content:center; background:var(--bg); }
  .sets img { width:36px; height:36px; }
  /* moves and the friends' room side by side, stacked when there's no room */
  #side { display:grid; grid-template-columns:minmax(220px,1fr) minmax(260px,340px); gap:16px; align-items:start; }
  @media (max-width:1250px) { #side { grid-template-columns:1fr; } }
  #room { display:flex; flex-direction:column; gap:10px; } .lock { color:var(--acc); font-weight:600; }
  .people { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .people span { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:1px 8px; font-size:12px; }
  .people span.me { border-color:var(--acc); }
  .picks div { display:flex; justify-content:space-between; padding:2px 0; } .picks .who { color:var(--dim); }
  #chat { display:flex; flex-direction:column; height:min(52vh,460px); padding:0; overflow:hidden; }
  #chatLog { flex:1; overflow:auto; padding:8px 12px; display:flex; flex-direction:column; gap:3px; }
  #chatLog .m b { color:var(--acc); font-weight:600; margin-right:5px; } #chatLog .m.me b { color:#7fb0ff; }
  #chatLog .at { align-self:center; font-size:11px; color:var(--dim); margin:4px 0; }
  #chatForm { display:flex; border-top:1px solid var(--line); }
  #chatForm input, #nameForm input { flex:1; padding:9px 12px; background:transparent; color:var(--fg); border:0; outline:0; }
  #nameForm { display:flex; gap:6px; } #nameForm input { border:1px solid var(--line); border-radius:6px; padding:7px 10px; } #settings label { display:flex; gap:8px; align-items:center; margin:4px 0; cursor:pointer; }
</style>
</head>
<body>
<header>
  <input id="url" placeholder="Lichess game or broadcast link">
  <button id="add">Watch</button>
  <button id="notif">Enable notifications</button>
  <button id="gear" title="Settings">⚙</button>
</header>
<div id="settings" class="card" hidden></div>
<style id="pieceCss"></style>
<div id="msg" class="msg" hidden></div>
<div id="sources"></div>
<script>
  // Runs even if the app module below can't start, so the page never fails silently.
  (function () {
    var fix = location.protocol === 'file:' || location.protocol === 'data:'
      ? 'This page was opened as a file, so it can\'t talk to Lichess. In Terminal run <code>cd ~/your-move</code> then <code>python3 watcher.py</code>, and open <a href="http://localhost:8765">http://localhost:8765</a>.'
      : 'The chess libraries didn\'t load (cdn.jsdelivr.net). Check your internet connection and reload.';
    function show() { if (window.appReady) return; var m = document.getElementById('msg'); m.innerHTML = fix; m.hidden = false; }
    document.addEventListener('click', function (e) { if (e.target.id === 'add') setTimeout(show, 50); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'url') setTimeout(show, 50); });
    document.addEventListener('paste', function (e) { if (e.target.id === 'url') setTimeout(show, 50); });
    setTimeout(show, 8000);
  })();
</script>
<main>
  <aside id="games"><div class="g dim">No games yet</div></aside>
  <div><div class="clk" id="clkTop"></div><div id="board"></div><div class="clk" id="clkBot"></div></div>
  <div id="side"><section id="panel"></section><aside id="room"></aside></div>
</main>
<script type="module">
import { Chess, parseInput, addSource, dropGame, follows, pgnGameId, readPgn, readGameInfo, readTick,
  toUci, revealGuesses, toggleBell, bellsFromWatcher, moveNo, fmtClock, fmtStart, moveRows,
  BOARDS, PIECES, pieceUrl, pieceCss, readSettings, gameUrl, roomScores, newCid, parseRoomHash } from './lib.js';
import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.1.1/+esm';

const API = 'https://lichess.org';
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let sources = LS.get('lb:sources', []);   // [{kind:'round'|'game', id, label}]
const guesses = LS.get('lb:guesses', {}); // gameId -> {ply: {uci, san, actual, actualSan, match, eval, bestSan}}
const bells = LS.get('lb:bells', {});     // gameId -> {name, url}: pop up on every move (the watcher's list when it runs)
const save = () => { LS.set('lb:guesses', guesses); LS.set('lb:bells', bells); LS.set('lb:sources', sources); };
const settings = readSettings(LS.get('lb:settings', null)); // board colours, piece set, coordinates, sound

const games = new Map();   // id -> {id, src, name, fens[], ucis[], sans[], result, over, unseen, ri}
const ctrls = new Map();   // source id -> AbortController
let cur = null, pinned = false, pinPly = 0, explore = null, feedback = null, wantGame = null, orient = 'white';
let watcherOn = false; // true when served by watcher.py, which shows desktop popups for belled games

// ---------- input ----------
$('#add').onclick = () => {
  const src = parseInput($('#url').value);
  if (!src) return say('That doesn\'t look like a Lichess broadcast or game link. Example: https://lichess.org/broadcast/…/…/xLgOJ6cb');
  say('');
  // One Lichess connection per round either way; addSource decides which of its games to show.
  const r = addSource(sources, src);
  wantGame = r.wantGame;
  if (r.action === 'new') { save(); watch(r.source); }
  else if (r.action === 'restart') restart(r.source);
  else if (wantGame && games.has(wantGame)) select(wantGame);
  $('#url').value = ''; renderSources();
};
function restart(s) { // re-read a round after changing which of its games we follow
  ctrls.get(s.id)?.abort();
  for (const [id, g] of games) if (g.src.id === s.id) games.delete(id);
  if (!games.has(cur)) cur = null;
  save(); watch(s); renderList(); renderPanel();
}
// (Not `onkeydown = e => cond && …`: a handler returning false cancels the key, which blocked Backspace and ⌘V.)
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter') $('#add').click(); });
// Pasting a link loads it straight away, no need to press Enter or Watch.
$('#url').addEventListener('paste', () => setTimeout(() => parseInput($('#url').value) && $('#add').click()));
const say = t => { $('#msg').textContent = t; $('#msg').hidden = !t; };
$('#notif').onclick = async () => { await Notification.requestPermission(); renderNotif(); };
const renderNotif = () => {
  const p = 'Notification' in window ? Notification.permission : 'denied';
  $('#notif').textContent = watcherOn ? 'Desktop popups on' : p === 'granted' ? 'Notifications on' : p === 'denied' ? 'Notifications blocked' : 'Enable notifications';
  $('#notif').classList.toggle('on', watcherOn || p === 'granted');
};

// ---------- streaming: one long-lived HTTP response per source, Lichess pushes as moves happen ----------
async function readStream(url, signal, onText) {
  const r = await fetch(url, { signal });
  if (r.status === 429) throw Object.assign(new Error('rate limited'), { wait: 61000 });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const rd = r.body.pipeThrough(new TextDecoderStream()).getReader();
  for (;;) { const { value, done } = await rd.read(); if (done) return; onText(value); }
}
function watch(src) {
  const ac = new AbortController(); ctrls.set(src.id, ac);
  let delay = 3000, first = true;
  const run = async () => {
    if (ac.signal.aborted) return;
    let got = false; src.quiet = Date.now() + 2500; // replayed history on (re)connect is not "new"
    try {
      if (src.kind === 'round') {
        if (first) { // the stream is silent for rounds that are over, so load a snapshot first
          const r = await fetch(`${API}/api/broadcast/round/${src.id}.pgn`, { signal: ac.signal });
          if (r.ok) (await r.text()).split('\n\n\n').forEach(t => onPgn(t, src));
          const firstOfRound = [...games.values()].find(g => g.src === src);
          if (!cur && firstOfRound && !wantGame) select(firstOfRound.id);
          try { // round name and start time
            const info = await (await fetch(`${API}/api/broadcast/-/-/${src.id}`, { signal: ac.signal })).json();
            src.name = `${info.tour?.name || ''} · ${info.round?.name || ''}`; src.startsAt = info.round?.startsAt;
            renderSources(); if (cur) renderPanel(); renderList();
          } catch {}
        }
        const untilStart = (src.startsAt || 0) - Date.now(); // the stream is silent before the round starts
        if (untilStart > 60000 && ![...games.values()].some(g => g.src === src && g.ucis.length)) {
          setLabel(src, `starts ${fmtStart(src.startsAt)}`); first = false;
          return setTimeout(run, Math.min(untilStart - 30000, 6 * 3600e3));
        }
        let buf = '';
        await readStream(`${API}/api/stream/broadcast/round/${src.id}.pgn`, ac.signal, t => {
          got = true; buf += t; const parts = buf.split('\n\n\n'); buf = parts.pop(); parts.forEach(p => onPgn(p, src));
        });
        if (buf.trim()) onPgn(buf, src);
        const mine = [...games.values()].filter(g => g.src === src);
        if (mine.length && mine.every(g => g.over)) return setLabel(src, 'finished');
      } else {
        let buf = '';
        const g = getGame(src.id, src, src.id); g.ri = 0;
        await readStream(`${API}/api/stream/game/${src.id}`, ac.signal, t => {
          got = true; buf += t; const lines = buf.split('\n'); buf = lines.pop();
          // game-info objects (with "id") come first and again at the end with status/winner; the rest are moves
          for (const l of lines) if (l.trim()) { const o = JSON.parse(l); o.id ? onGameHead(g, o) : onTick(g, o); }
        });
        if (g.over) return setLabel(src, 'finished');
      }
      setLabel(src, got ? 'reconnecting' : 'waiting for moves');
      delay = got ? 3000 : Math.min(delay * 2, 60000);
    } catch (e) {
      if (ac.signal.aborted) return;
      delay = e.wait || Math.min(delay * 2, 60000); setLabel(src, e.message);
    }
    first = false; setTimeout(run, delay);
  };
  setLabel(src, 'live'); run();
}
const setLabel = (src, l) => { src.label = l; renderSources(); };

function getGame(id, src, name) {
  if (!games.has(id)) games.set(id, { id, src, name, fens: [new Chess().fen()], ucis: [], sans: [], result: '*', over: false, unseen: 0 });
  return games.get(id);
}
function onPgn(text, src) {
  const id = pgnGameId(text, src.id);
  if (!id || !follows(src, id)) return; // not a game, or a game in this round you're not following
  const p = readPgn(text, src.id); if (!p) return;
  const g = getGame(id, src, p.name);
  g.clk = p.clk; g.result = p.result; g.over = p.over;
  update(g, p.ucis, p.sans, p.fens);
}
function onGameHead(g, o) {
  const info = readGameInfo(o);
  g.name = info.name;
  if (info.over) { g.over = true; g.result = info.result; if (g.id === cur) { draw(); renderPanel(); } }
  renderList();
}
function onTick(g, o) {
  const next = readTick(g, o);
  if (next) update(g, next.ucis, next.sans, next.fens);
}

function update(g, ucis, sans, fens) {
  const added = ucis.length - g.ucis.length;
  if (added <= 0 && ucis.join() === g.ucis.join()) { g.loaded = true; pick(g); return renderList(); } // e.g. a game that hasn't started
  g.ucis = ucis; g.sans = sans; g.fens = fens;
  const fresh = added > 0 && g.loaded && Date.now() > g.src.quiet;
  g.loaded = true;
  if (fresh) g.at = Date.now(); // we saw this move land, so we can run the clock from here
  if (fresh && g.id !== cur) g.unseen += added;
  reveal(g);
  if (fresh) notify(g);
  if (fresh && g.id === cur) tock();
  syncPlayed(g);
  if (room?.game?.id === g.id) { renderRoom(); renderChat(); }
  if (!pick(g) && g.id === cur) { draw(); renderPanel(); }
  renderList();
}
// Open the game the pasted link pointed at, or the first game we hear about.
function pick(g) {
  if (g.id === wantGame) { wantGame = null; select(g.id); return true; }
  if (!cur && !wantGame) { select(g.id); return true; }
  return false;
}

// ---------- guesses ----------
function reveal(g) {
  const shown = revealGuesses(guesses[g.id], g.ucis, g.sans);
  if (shown.length && g.id === cur) feedback = { gid: g.id, ply: shown.at(-1) };
  if (shown.length) save();
}

function notify(g) {
  if (watcherOn || !bells[g.id] || !('Notification' in window) || Notification.permission !== 'granted') return;
  if (!document.hidden && g.id === cur) return;
  const p = g.sans.length - 1;
  const n = new Notification(g.name, { body: `${moveNo(p)} ${g.sans[p]}${g.over ? '' : ' — what would you play?'}`, tag: g.id, renotify: true });
  n.onclick = () => { window.focus(); select(g.id); n.close(); };
}

// ---------- board ----------
const cg = Chessground($('#board'), {
  movable: { free: false, showDests: true, events: { after: (o, d) => onUserMove(o, d) } },
  draggable: { showGhost: true }, highlight: { lastMove: true, check: true }, coordinates: settings.coords,
});

// ---------- look: board colours, pieces, coordinates, sound ----------
function applySettings() {
  const [l, d] = BOARDS[settings.board];
  $('#board').style.setProperty('--sq-l', l); $('#board').style.setProperty('--sq-d', d);
  $('#pieceCss').textContent = pieceCss(settings.pieces);
  if (cg.state.coordinates !== settings.coords) { cg.set({ coordinates: settings.coords }); cg.redrawAll(); }
  LS.set('lb:settings', settings);
}
function renderSettings() {
  const el = $('#settings');
  el.innerHTML = `<h4>Board</h4><div class="swatches">${Object.entries(BOARDS).map(([k, [l, d]]) =>
      `<button data-board="${k}" class="${k === settings.board ? 'sel' : ''}" title="${k}" style="--l:${l};--d:${d}"></button>`).join('')}</div>
    <h4>Pieces</h4><div class="sets">${Object.keys(PIECES).map(k =>
      `<button data-pieces="${k}" class="${k === settings.pieces ? 'sel' : ''}" title="${k} (${PIECES[k]})"><img src="${pieceUrl(k, 'wN')}" alt="${k}"></button>`).join('')}</div>
    <h4>Options</h4>
    <label><input type="checkbox" id="optCoords" ${settings.coords ? 'checked' : ''}> Coordinates</label>
    <label><input type="checkbox" id="optSound" ${settings.sound ? 'checked' : ''}> Sound when a move lands</label>`;
  el.querySelectorAll('[data-board]').forEach(b => b.onclick = () => { settings.board = b.dataset.board; applySettings(); renderSettings(); });
  el.querySelectorAll('[data-pieces]').forEach(b => b.onclick = () => { settings.pieces = b.dataset.pieces; applySettings(); renderSettings(); });
  $('#optCoords').addEventListener('change', e => { settings.coords = e.target.checked; applySettings(); });
  $('#optSound').addEventListener('change', e => { settings.sound = e.target.checked; applySettings(); if (settings.sound) tock(); });
}
$('#gear').onclick = e => { e.stopPropagation(); const el = $('#settings'); el.hidden = !el.hidden; $('#gear').classList.toggle('on', !el.hidden); if (!el.hidden) renderSettings(); };
document.addEventListener('click', e => {
  // composedPath, not closest: picking a swatch redraws the panel, so the clicked button is already detached
  if (!$('#settings').hidden && !e.composedPath().some(n => n.id === 'settings' || n.id === 'gear')) { $('#settings').hidden = true; $('#gear').classList.remove('on'); }
});
let audio;
function tock() { // a short wooden click, made on the spot so there's no sound file to ship
  if (!settings.sound) return;
  try {
    audio ??= new AudioContext();
    const t = audio.currentTime, o = audio.createOscillator(), v = audio.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.08);
    v.gain.setValueAtTime(0.25, t); v.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(v).connect(audio.destination); o.start(t); o.stop(t + 0.13);
  } catch {}
}
applySettings();
const tryMove = (c, o, d) => { try { return c.move({ from: o, to: d, promotion: 'q' }); } catch { return null; } };
function dests(c) {
  const m = new Map();
  for (const mv of c.moves({ verbose: true })) m.set(mv.from, [...(m.get(mv.from) || []), mv.to]);
  return m;
}
function draw() {
  const g = games.get(cur); if (!g) return;
  let c, last, shapes = [], canMove;
  if (pinned) { c = explore; const h = explore.history({ verbose: true }).at(-1); last = h ? [h.from, h.to] : uciSq(g.ucis[pinPly - 1]); canMove = true; }
  else {
    c = new Chess(g.fens.at(-1)); last = uciSq(g.ucis.at(-1));
    const mine = guesses[g.id]?.[g.ucis.length];
    if (mine) shapes = [{ orig: mine.uci.slice(0, 2), dest: mine.uci.slice(2, 4), brush: 'blue' }];
    canMove = !g.over; // you can keep changing your move until the real one lands
  }
  const color = c.turn() === 'w' ? 'white' : 'black';
  cg.set({ fen: c.fen(), orientation: orient, turnColor: color, lastMove: last, check: c.inCheck() ? color : false,
    movable: { color: canMove ? color : undefined, dests: canMove ? dests(c) : new Map() } });
  cg.setAutoShapes(shapes);
  drawClocks();
}
// Clocks always show the live game. The side to move counts down from when we saw the last move arrive;
// right after loading we don't know when that was, so the clock holds still until the next move.
function drawClocks() {
  const g = games.get(cur); if (!g) return;
  const [wn, bn] = g.name.split(' – '), turn = g.fens.at(-1).split(' ')[1];
  const paint = (el, col, name) => {
    const run = !g.over && turn === col && g.ucis.length > 0;
    let t = g.clk?.[col];
    if (t != null && run && g.at) t = Math.max(0, t - (Date.now() - g.at) / 1000);
    el.className = `clk${run ? ' run' : ''}${t != null && t < 60 ? ' low' : ''}`;
    el.innerHTML = `<span>${esc(name || '')}</span><b>${fmtClock(t)}</b>`;
  };
  const [top, bot] = orient === 'white' ? [['b', bn], ['w', wn]] : [['w', wn], ['b', bn]];
  paint($('#clkTop'), ...top); paint($('#clkBot'), ...bot);
}
setInterval(drawClocks, 500);
const uciSq = u => u ? [u.slice(0, 2), u.slice(2, 4)] : undefined;
function onUserMove(o, d) {
  const g = games.get(cur);
  if (pinned) { tryMove(explore, o, d); return draw(); }
  if (myLock(g.id, g.ucis.length)) return draw(); // locked in: can't change it any more
  const c = new Chess(g.fens.at(-1)), m = tryMove(c, o, d);
  if (m) { (guesses[g.id] ??= {})[g.ucis.length] = { uci: toUci(m), san: m.san }; save(); }
  draw(); renderPanel();
}
function select(id) {
  cur = id; pinned = false; explore = null; feedback = null;
  const g = games.get(id); g.unseen = 0;
  draw(); renderPanel(); renderList(); renderRoom();
  $('#clkTop').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function setPinned(on) {
  const g = games.get(cur); pinned = on;
  if (on) { pinPly = g.ucis.length; explore = new Chess(g.fens.at(-1)); } else explore = null;
  draw(); renderPanel();
}
// Step through the real game. Stepping back pins automatically; ⏭ / End returns to live.
function step(d) {
  const g = games.get(cur); if (!g) return;
  if (d === Infinity) return setPinned(false);
  if (!pinned) { if (d > 0) return; setPinned(true); }
  if (d === -1 && explore.history().length) { explore.undo(); draw(); return renderPanel(); } // undo your own line first
  goTo(d === -Infinity ? 0 : pinPly + d);
}
// Show the position after `n` moves of the real game (from the move list). The latest move means live.
// Stepping ▶ to the end stays pinned (your line is kept safe); clicking the latest move in the list goes live.
function goTo(n, fromList = false) {
  const g = games.get(cur); if (!g) return;
  n = Math.max(0, Math.min(g.ucis.length, n));
  if (fromList && n === g.ucis.length) return setPinned(false);
  pinned = true; pinPly = n; explore = new Chess(g.fens[n]);
  draw(); renderPanel();
}
document.addEventListener('keydown', e => {
  if (e.target.closest?.('input')) return;
  const d = { ArrowLeft: -1, ArrowRight: 1, Home: -Infinity, End: Infinity }[e.key];
  if (d) { e.preventDefault(); step(d); }
});

// ---------- UI ----------
function renderSources() {
  $('#sources').innerHTML = sources.map((s, i) => `<span>${esc(s.name || `${s.kind} ${s.id}`)}${s.only
    ? ` · ${s.only.length} game${s.only.length > 1 ? 's' : ''}` : s.kind === 'round' ? ' · all games' : ''} · ${s.label || ''}<b data-i="${i}" title="Stop watching">✕</b></span>`).join('');
  $('#sources').querySelectorAll('b').forEach(b => b.onclick = () => {
    const s = sources.splice(+b.dataset.i, 1)[0]; ctrls.get(s.id)?.abort();
    for (const [id, g] of games) if (g.src.id === s.id) games.delete(id);
    if (!games.has(cur)) cur = null; save(); renderSources(); renderList(); renderPanel();
  });
}
// Stop following one game. For a whole round, the rest of its games stay.
function drop(g) {
  const s = g.src;
  if (bells[g.id]) tellWatcher(toggleBell(bells, g));
  const shown = [...games.values()].filter(x => x.src === s).map(x => x.id);
  games.delete(g.id);
  if (dropGame(sources, s, g.id, shown)) ctrls.get(s.id)?.abort();
  if (cur === g.id) { cur = null; const next = games.values().next().value; if (next) select(next.id); }
  save(); renderSources(); renderList(); renderPanel();
}
function renderList() {
  const el = $('#games'), list = [...games.values()];
  if (!list.length) { el.innerHTML = '<div class="g dim">No games yet</div>'; document.title = 'Your Move'; return; }
  el.innerHTML = list.map(g => `<div class="g ${g.id === cur ? 'cur' : ''}" data-id="${g.id}">
    <div class="n">${esc(g.name)}<small>${g.over ? g.result : g.ucis.length ? `${g.ucis.length} plies · live`
      : g.src.startsAt > Date.now() ? `starts ${fmtStart(g.src.startsAt)}` : 'not started'}</small></div>
    ${g.unseen ? `<span class="badge">${g.unseen}</span>` : ''}
    <button class="bell ${bells[g.id] ? 'on' : ''}" title="Pop up on every move">🔔</button>
    <button class="bell drop" title="Stop following this game">✕</button></div>`).join('');
  el.querySelectorAll('.g').forEach(r => r.onclick = e => {
    const id = r.dataset.id;
    if (e.target.closest('.drop')) return drop(games.get(id));
    if (e.target.closest('.bell')) {
      tellWatcher(toggleBell(bells, games.get(id)));
      save(); if (bells[id] && !watcherOn) $('#notif').click(); return renderList();
    }
    select(id);
  });
  const n = list.reduce((a, g) => a + g.unseen, 0);
  document.title = (n ? `(${n}) ` : '') + 'Your Move';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// The whole game: the move you're looking at is highlighted, your own moves sit under the players'.
function movesHtml(g) {
  const rows = moveRows(g.sans, guesses[g.id], g.over), at = (pinned ? pinPly : g.ucis.length) - 1;
  if (!rows.length) return '<div class="moves"><div class="empty">No moves yet.</div></div>';
  const cell = c => !c ? '<div></div>'
    : c.pending ? `<div class="mv pending" title="Your move, waiting for the player">${esc(c.pending)}?</div>`
    : `<div class="mv${c.ply === at ? ' cur' : ''}" data-ply="${c.ply}">${esc(c.san)}${c.mine
      ? `<i class="${c.match ? 'hit' : ''}">${c.match ? '✓ you too' : `you: ${esc(c.mine)}`}</i>` : ''}</div>`;
  return `<div class="moves">${rows.map(r => `<div class="no">${r.no}.</div>${cell(r.cells[0])}${cell(r.cells[1])}`).join('')}</div>`;
}
function renderPanel() {
  const g = games.get(cur), el = $('#panel');
  if (!g) return el.innerHTML = '<div class="card dim">No game open</div>';
  const ply = g.ucis.length, side = ply % 2 ? 'Black' : 'White', mine = guesses[g.id]?.[ply];
  const gs = Object.values(guesses[g.id] || {}).filter(x => x.actual), same = gs.filter(x => x.match).length;
  const locked = myLock(g.id, ply), inRoom = room && room.game?.id === g.id;
  let status;
  if (pinned) {
    const ahead = ply - pinPly, line = explore.history();
    status = `<b>Pinned</b> at ${pinPly ? `${moveNo(pinPly - 1)} ${g.sans[pinPly - 1]}` : 'the start'}
      ${line.length ? `<br>Your line: <b>${line.join(' ')}</b>` : ''}
      ${ahead > 0 ? `<br><span class="bad">Live is ${ahead} move${ahead > 1 ? 's' : ''} ahead</span>` : ''}
      <div class="row" style="margin-top:6px"><button id="reset">Reset line</button><button id="catch" class="on">Catch up</button></div>`;
  } else if (g.over) status = `<b>Game over: ${g.result}</b>`;
  else {
    const head = !ply && g.src.startsAt > Date.now() ? `<b>Starts ${fmtStart(g.src.startsAt)}</b>` : `<b>${side} to move</b>`;
    status = locked ? `${head} · <span class="lock">🔒 ${esc(locked.san)}</span>`
      : mine ? `${head} · you: <b>${esc(mine.san)}</b>${inRoom ? ' <button id="lockIn" class="on">🔒 Lock in</button>' : ''}`
      : head;
  }
  // No engine, no verdict: like watching in the hall, you just see your move next to theirs.
  const fb = feedback && guesses[g.id]?.[feedback.ply], f = fb && `<div class="card">
      ${moveNo(feedback.ply)} you <b>${esc(fb.san)}</b> · played <b class="${fb.match ? 'ok' : ''}">${esc(fb.actualSan)}</b>${fb.match ? ' ✓' : ''}</div>`;
  el.innerHTML = `<div class="card"><b>${esc(g.name)}</b>${gs.length ? `<div class="dim">same move ${same}/${gs.length}</div>` : ''}</div>
    <div class="card">${status}</div>${f || ''}
    <div class="card">${movesHtml(g)}
      <div class="nav"><button data-step="-Infinity" title="Start (Home)">⏮</button><button data-step="-1" title="Back (←)">◀</button>
      <button data-step="1" title="Forward (→)">▶</button><button data-step="Infinity" title="Live (End)" class="${pinned ? '' : 'on'}">⏭</button></div></div>
    <div class="row"><button id="pin" class="${pinned ? 'on' : ''}">${pinned ? 'Unpin' : 'Pin'}</button>
      <button id="flip">Flip</button></div>`;
  $('#lockIn')?.addEventListener('click', () => lockIn(g));
  el.querySelectorAll('[data-step]').forEach(b => b.onclick = () => step(+b.dataset.step));
  el.querySelectorAll('.mv[data-ply]').forEach(c => c.onclick = () => goTo(+c.dataset.ply + 1, true));
  const box = el.querySelector('.moves'), at = box?.querySelector('.cur, .pending');
  if (at) box.scrollTop = at.offsetTop - box.clientHeight / 2 + at.offsetHeight / 2; // keep the move you're on in view
  $('#pin').onclick = () => setPinned(!pinned);
  $('#flip').onclick = () => { orient = orient === 'white' ? 'black' : 'white'; draw(); };
  if (pinned) { $('#catch').onclick = () => setPinned(false); $('#reset').onclick = () => { explore = new Chess(g.fens[pinPly]); draw(); }; }
}

// ---------- rooms: watch with friends ----------
// The room lives on the watcher that served this page (yours, or a friend's through a tunnel).
// The page long-polls it, which gets through any tunnel or proxy.
// Everyone locks in a move before the player makes it; you see friends' moves once you've locked
// yours or the real move is in.
let room = null, roomsOn = false, publicUrl = null, poller = null; // room: {id, game, chat, picks, played, people}
const me = LS.get('lb:me', null) || { cid: newCid(), name: '' };
LS.set('lb:me', me);
const myLock = (gid, ply) => room?.picks?.[gid]?.[ply]?.find(x => x.me);
async function roomPost(body) {
  const r = await fetch(`/room/${room.id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cid: me.cid, name: me.name, ...body }) }).catch(() => null);
  if (!r) return say('Lost the room connection.') || false;
  if (!r.ok) { say((await r.json().catch(() => ({}))).error || 'Room error'); return false; }
  return true;
}
function joinRoom(id) {
  if (room?.id === id && poller) return;
  poller?.abort(); poller = null;
  room = { id, chat: [], picks: {}, played: {}, people: [], game: null, version: 0 };
  if (!me.name) return renderRoom();
  renderRoom(); pollRoom(id);
}
// Ask the watcher for news and wait; it answers when the room changes (or after 25s), then ask again.
async function pollRoom(id) {
  const ac = poller = new AbortController();
  while (!ac.signal.aborted) {
    const after = room.chat.at(-1)?.id || 0;
    try {
      const r = await fetch(`/room/${id}/poll?cid=${me.cid}&name=${encodeURIComponent(me.name)}&since=${room.version}&after=${after}`, { signal: ac.signal });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
      onRoomState(await r.json());
    } catch (e) {
      if (ac.signal.aborted) return;
      say(`Room: ${e.message}. Retrying…`); await new Promise(f => setTimeout(f, 3000));
    }
  }
}
function leaveRoom() {
  poller?.abort(); poller = null; room = null;
  history.replaceState(null, '', location.pathname);
  renderRoom(); renderPanel();
}
function onRoomState(st) {
  const first = !room.version, newGame = st.game?.id !== room.game?.id;
  const { chat, ...rest } = st;
  Object.assign(room, rest);
  if (chat.length) room.chat = [...room.chat, ...chat].slice(-300);
  if ($('#msg').textContent.startsWith('Room:')) say('');
  renderChat(first); renderRoom(); renderPanel(); draw();
  if (first || newGame) openRoomGame();
}
function openRoomGame() { // everyone in the room watches the room's game
  const gm = room?.game; if (!gm) return;
  if (games.has(gm.id)) { syncPlayed(games.get(gm.id)); if (cur !== gm.id) select(gm.id); return; }
  $('#url').value = gm.url; $('#add').click();
}
function syncPlayed(g) {
  if (room?.game?.id === g.id && g.ucis.length > (room.played[g.id] || 0)) roomPost({ type: 'played', game: g.id, ply: g.ucis.length });
}
async function lockIn(g) {
  const ply = g.ucis.length, x = guesses[g.id]?.[ply];
  if (x && await roomPost({ type: 'lock', game: g.id, ply, uci: x.uci, san: x.san })) say('');
}
async function createRoom() {
  const r = await fetch('/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => null);
  if (!r?.ok) return say('Could not create a room.');
  const { id } = await r.json();
  history.replaceState(null, '', `#room=${id}`);
  joinRoom(id);
  const g = games.get(cur);
  if (g && me.name) roomPost({ type: 'game', game: { id: g.id, url: gameUrl(g), name: g.name } });
}
// The link friends can open: the watcher's public --share link if it has one, else this page's own address.
const roomLink = () => `${publicUrl || location.origin}/#room=${room.id}`;
const onlyHere = () => !publicUrl && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
function renderRoom() {
  const el = $('#room');
  if (!roomsOn) return el.innerHTML = '';
  if (!room) {
    el.innerHTML = `<div class="card"><b>Friends</b><div class="row" style="margin-top:6px">
      <button id="mkRoom" ${cur ? '' : 'disabled'}>New room</button></div></div>`;
    return $('#mkRoom').onclick = () => { if (!me.name) { room = { id: null }; return renderRoom(); } createRoom(); };
  }
  if (!me.name || !room.id) {
    el.innerHTML = `<div class="card"><b>Your name</b><form id="nameForm" style="margin-top:6px">
      <input id="nameIn" maxlength="24" autocomplete="nickname" required><button>Join</button></form></div>`;
    $('#nameIn').focus();
    return $('#nameForm').addEventListener('submit', e => {
      e.preventDefault(); me.name = $('#nameIn').value.trim().slice(0, 24); if (!me.name) return;
      LS.set('lb:me', me);
      if (room.id) { const id = room.id; room = null; joinRoom(id); } else { room = null; createRoom(); }
    });
  }
  const g = room.game && games.get(room.game.id), ply = g ? g.ucis.length : 0;
  const now = room.picks[room.game?.id]?.[ply] || [], last = ply && room.picks[room.game?.id]?.[ply - 1] || [];
  const scores = g ? roomScores(room.picks[g.id], g.ucis) : [];
  const pick = x => x.san ? `<b>${esc(x.san)}</b>` : '<span class="lock">🔒</span>';
  let top = el.querySelector('#roomTop');
  if (!top) {
    el.innerHTML = `<div id="roomTop"></div><div class="card" id="chat"><div id="chatLog"></div>
      <form id="chatForm"><input id="chatIn" maxlength="500" placeholder="Message" autocomplete="off"><button>Send</button></form></div>`;
    $('#chatForm').addEventListener('submit', e => {
      e.preventDefault(); const t = $('#chatIn').value.trim(); if (!t) return;
      const rg = room.game && games.get(room.game.id);
      roomPost({ type: 'chat', text: t, ply: rg ? rg.ucis.length : null }).then(ok => ok && ($('#chatIn').value = ''));
    });
    top = $('#roomTop'); renderChat(true);
  }
  top.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between;align-items:center">
      <b>Room ${room.id}</b><span class="row"><button id="copyLink">Copy link</button><button id="leave" title="Leave room">✕</button></span></div>
    ${onlyHere() ? '<div class="dim" style="font-size:12px">Link works on this Mac only. Run <code>python3 watcher.py --share</code> to invite friends.</div>' : ''}
    <div class="people">${room.people.map(n => `<span class="${n === me.name ? 'me' : ''}">${esc(n)}</span>`).join('')}</div>
    ${cur && cur !== room.game?.id ? `<button id="useGame" style="margin-top:8px">Watch this game here</button>` : ''}</div>
    ${g && !g.over ? `<div class="card picks"><b>${moveNo(ply)} locked in</b>${now.length
      ? now.map(x => `<div><span class="who">${esc(x.name)}</span>${pick(x)}</div>`).join('') : '<div class="dim">nobody yet</div>'}</div>` : ''}
    ${last.length ? `<div class="card picks"><b>${moveNo(ply - 1)} ${esc(g.sans[ply - 1])}</b>${last.map(x =>
      `<div><span class="who">${esc(x.name)}</span><span class="${x.uci === g.ucis[ply - 1] ? 'ok' : ''}">${esc(x.san)}${x.uci === g.ucis[ply - 1] ? ' ✓' : ''}</span></div>`).join('')}</div>` : ''}
    ${scores.length ? `<div class="card picks"><b>Score</b>${scores.map(s =>
      `<div><span class="who">${esc(s.name)}</span><span>${s.hits}/${s.of}</span></div>`).join('')}</div>` : ''}`;
  $('#copyLink').onclick = async () => { // ask again: --share may have got its link after this page loaded
    publicUrl = (await fetch('/rooms').then(r => r.json()).catch(() => null))?.public || publicUrl;
    navigator.clipboard?.writeText(roomLink()).then(() => { $('#copyLink').textContent = 'Copied'; setTimeout(() => $('#copyLink') && ($('#copyLink').textContent = 'Copy link'), 1500); }); renderRoom(); };
  $('#leave').onclick = leaveRoom;
  $('#useGame') && ($('#useGame').onclick = () => { const cg_ = games.get(cur); roomPost({ type: 'game', game: { id: cg_.id, url: gameUrl(cg_), name: cg_.name } }); });
}
function renderChat(all) {
  const log = $('#chatLog'); if (!log || !room) return;
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const g = room.game && games.get(room.game.id);
  let lastPly = null;
  log.innerHTML = room.chat.map(m => {
    // a small marker when the game has moved on between messages
    const at = m.ply != null && m.ply !== lastPly && m.ply > 0 && g?.sans[m.ply - 1]
      ? `<div class="at">${moveNo(m.ply - 1)} ${esc(g.sans[m.ply - 1])}</div>` : '';
    if (m.ply != null) lastPly = m.ply;
    return `${at}<div class="m ${m.name === me.name ? 'me' : ''}"><b>${esc(m.name)}</b>${esc(m.text)}</div>`;
  }).join('');
  if (all || stick) log.scrollTop = log.scrollHeight;
}
fetch('/rooms').then(r => r.ok && r.headers.get('Content-Type') === 'application/json' ? r.json() : null).catch(() => null)
  .then(info => { roomsOn = !!info; publicUrl = info?.public || null; renderRoom(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (cur) { games.get(cur).unseen = 0; renderList(); }
  loadWatcherFollows(); // pick up 🔔 changes made in another browser
});
// Tell watcher.py (if it's what served this page) which games have the bell on.
// When watcher.py served this page, its list of followed games is the one that counts: show it here,
// and send it one change at a time ({add} or {remove}), never a whole list that could wipe another browser's.
async function loadWatcherFollows() {
  try {
    const r = await fetch('/follow');
    watcherOn = r.ok && r.headers.get('Content-Type') === 'application/json';
    if (watcherOn) { bellsFromWatcher(bells, await r.json()); save(); renderList(); }
  } catch { watcherOn = false; }
  renderNotif();
}
async function tellWatcher(change) {
  if (!watcherOn) return;
  try {
    const r = await fetch('/follow', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(change) });
    if (r.ok) { bellsFromWatcher(bells, await r.json()); save(); renderList(); } // show what the watcher now has
  } catch { watcherOn = false; renderNotif(); }
}
loadWatcherFollows();
window.appReady = true;
renderNotif(); renderSources(); renderPanel();
sources.forEach(watch);
// Deep links: watcher.py (and shared links) open the app as /#<lichess url> to jump straight to a game.
function openFromHash() {
  const rid = parseRoomHash(location.hash);
  if (rid) return joinRoom(rid); // the room link stays in the address bar, so reloading rejoins
  if (location.hash.length < 2) return;
  $('#url').value = decodeURIComponent(location.hash.slice(1));
  history.replaceState(null, '', location.pathname); $('#add').click();
}
openFromHash(); addEventListener('hashchange', openFromHash);
</script>
